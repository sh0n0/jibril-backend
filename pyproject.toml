[project]
name = "jibril-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sh0n0", email = "44708388+sh0n0@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
]

[project.scripts]
jibril-backend = "jibril_backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
