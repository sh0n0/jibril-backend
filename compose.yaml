services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      # Bound to localhost only; on the VPS, put a reverse proxy in front if
      # Elasticsearch must be reachable from outside.
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Local-only tooling: started with `docker compose --profile kibana up -d`,
  # so a plain `docker compose up -d` (e.g. on the VPS) leaves it out.
  kibana-setup:
    profiles: [kibana]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
    # Kibana cannot connect as the `elastic` superuser; give the built-in
    # kibana_system user a password instead.
    command: >-
      bash -c 'curl -sf -u "elastic:$$ELASTIC_PASSWORD"
      -H "Content-Type: application/json"
      http://elasticsearch:9200/_security/user/kibana_system/_password
      -d "{\"password\":\"$$KIBANA_PASSWORD\"}"'
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    profiles: [kibana]
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      kibana-setup:
        condition: service_completed_successfully

volumes:
  esdata:
