name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag is published
        with:
          enable-cache: true

      # Also installs the Python pinned in .python-version.
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Django system check
        run: uv run jibril-backend check

      - name: OpenAPI schema
        run: uv run jibril-backend spectacular --validate --fail-on-warn --file /dev/null
